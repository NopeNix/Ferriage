# Ferriage itself — one peer, one container, one state dir (Phase 1.6).
#
# Every node runs this file. State is files: the /stacks volume, holding
# one subdirectory per stack (Compose files = source of truth, CONCEPT).
# The peer talks to the host Docker daemon through the bind-mounted
# socket: adopting stacks, deploy's `docker compose up -d`, and volume
# copy all go through it. That is by design (CONCEPT hard requirement 5:
# privileged containers first-class; no orchestrator tax).
#
# Run on a host:
#   docker compose -f deploy/docker-compose.yml up -d
# Sync peers into each other with FERRIAGE_PEER (comma-separated peer
# URLs, e.g. http://10.0.0.1:8080). The mesh is plain HTTP pull in
# Phase 1; Iroh is Phase 4 territory (see docs/architecture.md).
#
# Images: nopenix/ferriage (peer) + nopenix/ferriage-ui (UI).
# Build locally with `docker compose -f deploy/docker-compose.yml up -d --build`
# (pass FERRIAGE_VERSION / FERRIAGE_COMMIT to stamp the build).

services:
  peer:
    image: nopenix/ferriage:${FERRIAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        FERRIAGE_VERSION: ${FERRIAGE_VERSION:-dev}
        FERRIAGE_COMMIT: ${FERRIAGE_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      # State dir inside the container; the peer binary defaults agree.
      FERRIAGE_STATE_DIR: /stacks
      # Comma-separated list of other peers to sync from. Empty = no sync.
      FERRIAGE_PEER: ${FERRIAGE_PEER:-}
      FERRIAGE_SYNC_INTERVAL: ${FERRIAGE_SYNC_INTERVAL:-30s}
      # Shoutrrr notification URLs (comma-separated, ADR 0007).
      # Empty = notifications disabled. These are secrets (webhook
      # tokens, SMTP creds) — they arrive only via env and never
      # cross the peer API, so keep them out of committed files.
      FERRIAGE_NOTIFY_URLS: ${FERRIAGE_NOTIFY_URLS:-}
      # Restic repo password (ADR 0011), env or file-mounted.
      # Empty = backups disabled (status still answers). Secrets:
      # env only, never the API.
      FERRIAGE_RESTIC_PASSWORD: ${FERRIAGE_RESTIC_PASSWORD:-}
      FERRIAGE_RESTIC_PASSWORD_FILE: ${FERRIAGE_RESTIC_PASSWORD_FILE:-}
      FERRIAGE_BACKUP_KEEP: ${FERRIAGE_BACKUP_KEEP:-7}
    volumes:
      # State lives on disk, never in a database (AGENTS.md §3).
      - ferriage_state:/stacks
      # The daemon socket: how the peer adopts, deploys, and moves volumes.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${FERRIAGE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    image: nopenix/ferriage-ui:${FERRIAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
      args:
        FERRIAGE_VERSION: ${FERRIAGE_VERSION:-dev}
        FERRIAGE_COMMIT: ${FERRIAGE_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      peer:
        condition: service_healthy
    environment:
      # BFF proxies to the peer in this compose network (peer service name).
      FERRIAGE_PEER: http://peer:8080
      # OIDC gate (ADR 0004). Empty = auth off (dev only).
      FERRIAGE_OIDC_ISSUER: ${FERRIAGE_OIDC_ISSUER:-}
      FERRIAGE_OIDC_CLIENT_ID: ${FERRIAGE_OIDC_CLIENT_ID:-}
      FERRIAGE_OIDC_CLIENT_SECRET: ${FERRIAGE_OIDC_CLIENT_SECRET:-}
      FERRIAGE_OIDC_REDIRECT_URI: ${FERRIAGE_OIDC_REDIRECT_URI:-}
      FERRIAGE_SESSION_SECRET: ${FERRIAGE_SESSION_SECRET:-}
      FERRIAGE_COOKIE_SECURE: ${FERRIAGE_COOKIE_SECURE:-}
    ports:
      - "${FERRIAGE_UI_PORT:-5173}:5173"
    # No curl/wget in node:24-alpine — probe with node itself.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ferriage_state:
    name: ferriage_state
